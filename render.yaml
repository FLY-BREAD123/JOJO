services:
  - type: web
    name: jeokya-intranet
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    # 데이터는 이 디스크(/var/data)에 저장된다. 다시 배포하거나 재시작해도 남는다.
    disk:
      name: jeokya-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
