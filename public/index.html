  /* ================================================================
     화면: 계산기 (총기 판매)
     ================================================================ */
  const CALC_KEY = 'jeokya.calc';
  const CALC_GROUPS = ['특총', '일반 총', '총알'];
  function won(n) {
    n = Math.round(n);
    if (!n) return '0원';
    const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4), rest = n % 1e4;
    const parts = [];
    if (eok) parts.push(comma(eok) + '억');
    if (man) parts.push(comma(man) + '만');
    if (rest) parts.push(comma(rest));
    return parts.join(' ') + '원';
  }
  const guns = () => (S.settings && S.settings.guns) || [];
  const gunUnit = (g) => (g.unit ? '묶음' : '정');
  const gunText = (g, q) => g.name + ' ' + q + gunUnit(g) + (g.unit && parseInt(g.unit, 10) ? ' (' + comma(q * parseInt(g.unit, 10)) + '발)' : '');
  function calcLines() {
    return guns().filter((g) => S.calc[g.id] > 0).map((g) => ({ g, q: S.calc[g.id], sum: g.price * S.calc[g.id] }));
  }
  function receiptHtml() {
    const lines = calcLines();
    const total = lines.reduce((t, l) => t + l.sum, 0);
    return '<div class="sheet-head"><h3>견적</h3>' + (lines.length ? '<button type="button" class="link-danger" data-act="calc-reset">비우기</button>' : '') + '</div>' +
      (lines.length
        ? '<ul class="rows rc-lines">' + lines.map((l) => '<li><span>' + esc(gunText(l.g, l.q)) + '</span><b>' + won(l.sum) + '</b></li>').join('') + '</ul>'
        : '<p class="empty">수량을 넣으면 여기에 합계가 나옵니다.</p>') +
      '<div class="rc-total"><span>합계</span><strong>' + won(total) + '</strong><em>' + comma(total) + '원</em></div>' +
      '<div class="rc-actions"><button type="button" class="btn full" data-act="calc-copy"' + (total ? '' : ' disabled') + '>' + ic('i-copy') + '견적 복사</button>' +
      '<button type="button" class="btn-ghost full" data-act="calc-deposit"' + (total ? '' : ' disabled') + '>판매 금액 입금 기록</button></div>';
  }
  function renderCalc() {
    const groups = CALC_GROUPS.concat(guns().map((g) => g.group).filter((x, i, a) => !CALC_GROUPS.includes(x) && a.indexOf(x) === i)).map((name) => {
      const list = guns().filter((g) => g.group === name);
      if (!list.length) return '';
      return '<section class="sheet calc-group"><div class="sheet-head"><h3>' + esc(name) + '</h3></div>' + list.map((g) => {
        const q = S.calc[g.id] || 0;
        return '<div class="calc-row' + (q ? ' on' : '') + '" data-id="' + esc(g.id) + '">' +
          '<div class="ci"><strong>' + esc(g.name) + '</strong><span>' + won(g.price) + (g.unit ? ' / ' + esc(g.unit) : '') + '</span></div>' +
          '<div class="stepper"><button type="button" class="step" data-act="calc-step" data-id="' + esc(g.id) + '" data-d="-1" aria-label="' + esc(g.name) + ' 하나 빼기">−</button>' +
          '<input class="input" data-calc="' + esc(g.id) + '" inputmode="numeric" autocomplete="off" value="' + q + '" aria-label="' + esc(g.name) + ' 수량">' +
          '<button type="button" class="step" data-act="calc-step" data-id="' + esc(g.id) + '" data-d="1" aria-label="' + esc(g.name) + ' 하나 더하기">+</button></div>' +
          '<div class="ci-sub" data-sub="' + esc(g.id) + '">' + (q ? won(g.price * q) : '') + '</div></div>';
      }).join('') + '</section>';
    }).join('');
    return '<div class="calc"><div class="calc-items">' + groups + '</div><aside class="sheet receipt" id="receipt" aria-live="polite">' + receiptHtml() + '</aside></div>';
  }
  function updateCalc() {
    guns().forEach((g) => {
      const q = S.calc[g.id] || 0;
      const sub = $('[data-sub="' + g.id + '"]');
      if (sub) sub.textContent = q ? won(g.price * q) : '';
      const inp = $('[data-calc="' + g.id + '"]');
      if (inp && document.activeElement !== inp) inp.value = q;
      const row = $('.calc-row[data-id="' + g.id + '"]');
      if (row) row.classList.toggle('on', q > 0);
    });
    const r = $('#receipt');
    if (r) r.innerHTML = receiptHtml();
    store.set(CALC_KEY, JSON.stringify(S.calc));
  }
  function quoteText() {
    const lines = calcLines();

  }

      const tl = t.titles.length - 1;
      const rows = t.titles.map((x, xi) =>
        '<li class="ro-title">' +
          '<div class="ro-name">' + (x.icon ? '<span class="ro-icon" aria-hidden="true">' + esc(x.icon) + '</span>' : '') +
            (x.name ? '<span>' + esc(x.name) + '</span>' : '<span class="none">이름 없음</span>') + '</div>' +
          '<div class="ro-people">' + x.people.map((p) => personChip(p, edit)).join('') +

          (edit ? '<span class="ro-tools">' +
            roTool('ro-title-move', x.id, 'i-up', (x.name || '직급') + ' 위로', ' data-d="-1"' + (xi === 0 ? ' disabled' : '')) +
            roTool('ro-title-move', x.id, 'i-dn', (x.name || '직급') + ' 아래로', ' data-d="1"' + (xi === tl ? ' disabled' : '')) +
            roTool('ro-title-edit', x.id, 'i-pen', (x.name || '직급') + ' 고치기') + '</span>' : '') +
        '</li>').join('');

  async function copyText(text) {

    const ta = document.createElement('textarea');

  /* ================================================================
     새 소식: 5초마다 새 로그를 받아 알림을 띄우고 소리를 낸다.
     소리를 꺼도 알림 카드는 그대로 보인다.
     ================================================================ */
  const LIVE = { lastId: 0, busy: false, ready: false };
  const EV_TONES = {
    duty_on: [659, 880], duty_off: [880, 587], peak_on: [784, 988, 1319], peak_off: [988, 740],
    report_war: [523, 659, 784, 1047], report_pvp: [587, 880, 1175], ledger_in: [1175, 1568], ledger_out: [784, 523],
    warn: [392, 262], warn_cancel: [523, 659], kick: [330, 220], join: [659, 988], rank_up: [659, 988], rank_down: [659, 494],
  };
  const soundOn = () => store.get(SOUND_KEY) !== 'off';
  let audioCtx = null;
  function audio() {
    try {
      if (!audioCtx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        audioCtx = new C();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (_) { return null; }
  }
  function chime(ev) {
    if (!soundOn()) return;
    const ctx = audio();
    if (!ctx) return;
    let t = ctx.currentTime + 0.02;
    (EV_TONES[ev] || [880, 1175]).forEach((f) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.45);
      t += 0.12;
    });
  }
  function renderSoundBtn() {
    const on = soundOn();
    const b = $('#soundBtn');
    b.setAttribute('aria-pressed', String(on));
    b.title = on ? '알림 소리 켜짐 (누르면 끔)' : '알림 소리 꺼짐 (알림은 계속 보입니다)';
    b.setAttribute('aria-label', b.title);
    b.classList.toggle('off', !on);
    b.innerHTML = ic(on ? 'i-bell' : 'i-bell-off');
  }
  function showNotif(a) {
    const box = $('#notifs');

    box.prepend(el);
    while (box.children.length > 4) box.lastElementChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 7000);
  }
  const canRefresh = () => {

  async function pollLive() {
    if (!S.me || !S.token || LIVE.busy) return;
    LIVE.busy = true;
    try {
      const d = await api('/logs/since?after=' + LIVE.lastId);
      if (!LIVE.ready || d.lastId < LIVE.lastId) { LIVE.lastId = d.lastId; LIVE.ready = true; return; }
      if (!d.logs.length) return;
      LIVE.lastId = d.logs[d.logs.length - 1].id;
      const others = d.logs.filter((a) => a.by !== S.me.id && a.ev !== 'roster');
      others.slice(-4).forEach(showNotif);
      if (others.length) chime(others[others.length - 1].ev);
      if (S.route === 'logs') prependLogs(d.logs);
      else if (['home', 'duty', 'reports', 'treasury'].includes(S.route) && canRefresh()) refresh();
      else if (S.route === 'roster' && !S.rosterEdit && canRefresh() && d.logs.some((a) => a.by !== S.me.id && (a.ev === 'roster' || a.type === 'duty'))) refresh();

  }

  function syncReportForm(f) {
    const kind = (f.querySelector('input[name=kind]:checked') || {}).value || 'ground';

      if (inp) inp.placeholder = range;

    const btn = f.querySelector('.form-actions .btn');

    formErr(f, '');

  /* ---------------- 스크린샷 글자 인식: 참여자 자동 체크 ----------------
     tesseract.js(브라우저 안에서 도는 글자 인식)를 처음 쓸 때만 불러온다.
     게임 화면은 어두운 바탕에 밝은 글씨가 많아 흑백 반전 후 읽고,
     조직원 이름과 비교해 한 글자 정도 틀려도 찾는다. */
  const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const OCR = { worker: null, loading: null, onProgress: null, pass: '' };
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.async = true;
      el.onload = () => resolve();
      el.onerror = () => reject(new Error('글자 인식 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요'));
      document.head.appendChild(el);
    });
  }
  function ocrWorker() {
    if (OCR.worker) return Promise.resolve(OCR.worker);
    if (!OCR.loading) {
      OCR.loading = (async () => {
        if (!window.Tesseract) await loadScript(TESS_SRC);
        const w = await window.Tesseract.createWorker(['kor', 'eng'], 1, {
          logger: (m) => { if (OCR.onProgress) OCR.onProgress(m); },
        });
        // 11 = 흩어진 글씨 찾기 (목록, 이름표처럼 화면 곳곳에 있는 이름에 강함)
        await w.setParameters({ tessedit_pageseg_mode: '11' });
        OCR.worker = w;
        return w;
      })().catch((e) => { OCR.loading = null; throw e; });
    }
    return OCR.loading;
  }
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 열 수 없습니다')); };
      img.src = url;
    });
  }
  // 같은 스크린샷을 여러 방식으로 손봐서 읽는다:
  //  1) 흑백 + 대비 (어두운 화면이면 반전)  2) 아주 밝은 글씨만 남김 (게임 목록, 이름표의 흰 글씨)
  //  3) 2를 한 픽셀 굵게 (외곽선 때문에 가늘어진 글씨)  4) 아주 어두운 글씨만 남김 (밝은 바탕의 검은 글씨)
  function ocrVariants(img) {
    const scale = Math.min(3, Math.max(1, 2400 / Math.max(img.width, 1)));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const base = document.createElement('canvas');
    base.width = w; base.height = h;
    const bg = base.getContext('2d', { willReadFrequently: true });
    bg.imageSmoothingQuality = 'high';
    bg.drawImage(img, 0, 0, w, h);
    const src = bg.getImageData(0, 0, w, h).data;
    const n = w * h;
    const Y = new Uint8ClampedArray(n);
    let sum = 0;
    for (let i = 0, j = 0; j < n; i += 4, j++) { Y[j] = 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2]; sum += Y[j]; }
    const dark = sum / n < 128;
    const paint = (valueAt) => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      const out = g.createImageData(w, h);
      const px = out.data;
      for (let i = 0, j = 0; j < n; i += 4, j++) { const v = valueAt(j); px[i] = px[i + 1] = px[i + 2] = v; px[i + 3] = 255; }
      g.putImageData(out, 0, 0);
      return c;
    };
    const mask = (test) => { const m = new Uint8Array(n); for (let j = 0; j < n; j++) m[j] = test(Y[j]) ? 1 : 0; return m; };
    const grow = (m) => {
      const o = new Uint8Array(n);
      for (let y = 1; y < h - 1; y++) for (let x = 1, j = y * w + 1; x < w - 1; x++, j++) o[j] = m[j] | m[j - 1] | m[j + 1] | m[j - w] | m[j + w];
      return o;
    };
    const bright = mask((y) => y >= 232);
    const darkText = mask((y) => y <= 48);
    return [
      paint((j) => Math.max(0, Math.min(255, ((dark ? 255 - Y[j] : Y[j]) - 128) * 1.5 + 128))),
      paint((j) => (bright[j] ? 0 : 255)),
      (() => { const g2 = grow(bright); return paint((j) => (g2[j] ? 0 : 255)); })(),
      paint((j) => (darkText[j] ? 0 : 255)),
    ];
  }
  const normName = (v) => String(v || '').toLowerCase().replace(/[^0-9a-z가-힣]/g, '');
  function within1(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length] <= 1;
  }
  function matchMembers(text, members) {
    const lines = String(text).split(/\n+/).map(normName).filter(Boolean);
    const joined = lines.join('|');
    return members.filter((m) => {
      const name = normName(m.name), id = normName(m.username);
      if (name.length >= 2 && joined.includes(name)) return true;
      if (id.length >= 4 && joined.includes(id)) return true;
      if (name.length < 3) return false;
      for (const line of lines) {
        for (let len = name.length - 1; len <= name.length + 1; len++) {
          for (let i = 0; i + len <= line.length; i++) if (within1(line.substr(i, len), name)) return true;
        }
      }
      return false;
    });
  }
  async function readShot(file, members, status) {
    const { img, url } = await loadImage(file);
    OCR.onProgress = (m) => {
      if (m.status === 'recognizing text') status('이름 읽는 중 ' + (OCR.pass ? '(' + OCR.pass + ') ' : '') + Math.round((m.progress || 0) * 100) + '%');
      else status('글자 인식 준비 중 (처음 한 번은 몇 초 걸립니다)');
    };
    status('글자 인식 준비 중 (처음 한 번은 몇 초 걸립니다)');
    try {
      const worker = await ocrWorker();
      const variants = ocrVariants(img);
      const found = new Map();
      for (let v = 0; v < variants.length; v++) {
        OCR.pass = (v + 1) + '/' + variants.length;
        const res = await worker.recognize(variants[v]);
        if (window.JEOKYA_OCR_DEBUG) window.JEOKYA_OCR_DEBUG.push(res.data.text);
        matchMembers(res.data.text, members).forEach((m) => found.set(m.id, m));
        if (found.size === members.length) break;
      }
      return { url, found: Array.from(found.values()) };
    } finally { OCR.onProgress = null; OCR.pass = ''; }
  }
  async function handleShots(files) {
    const f = $('form[data-form="report"]');
    if (!f || !S.reportMembers) return;
    const imgs = Array.from(files || []).filter((x) => /^image\//.test(x.type)).slice(0, 4);
    const statusEl = $('.shot-status', f);
    if (!imgs.length) { statusEl.textContent = '이미지 파일만 올릴 수 있습니다'; return; }
    const zone = $('.shot', f);
    zone.classList.add('busy');
    const found = new Map();
    try {
      for (let i = 0; i < imgs.length; i++) {
        const prefix = imgs.length > 1 ? (i + 1) + '/' + imgs.length + ' ' : '';
        const r = await readShot(imgs[i], S.reportMembers, (t) => { statusEl.textContent = prefix + t; });
        const th = document.createElement('img');
        th.src = r.url;
        th.alt = '올린 스크린샷 ' + (i + 1);
        $('.shot-thumbs', f).appendChild(th);
        r.found.forEach((m) => found.set(m.id, m));
      }
      if (!document.contains(f)) return;
      found.forEach((m) => {
        const box = f.querySelector('input[name=participants][value="' + m.id + '"]');
        if (box) { box.checked = true; box.closest('label').classList.add('auto'); }

      statusEl.textContent = found.size
        ? '스크린샷에서 ' + found.size + '명을 찾아 체크했습니다: ' + Array.from(found.values()).map((m) => m.name).join(', ') + '. 빠진 사람은 직접 눌러 주세요.'
        : '스크린샷에서 조직원 이름을 찾지 못했습니다. 이름이 잘 보이게 다시 찍거나 직접 골라 주세요.';

  }

      const fd = new FormData(f);
      const btn = f.querySelector('.btn');
      formErr(f, '');
      if (fd.get('next') !== fd.get('next2')) { formErr(f, '새 비밀번호 두 칸이 서로 다릅니다'); return; }
      busy(btn, true, '바꾸는 중');
      try {
        await api('/me/password', { method: 'POST', body: { current: fd.get('current'), next: fd.get('next') } });
        closeModal();
        toast('비밀번호를 바꿨습니다');
      } catch (e) { formErr(f, e.message); busy(btn, false); }
    },
    async settings(f) {
      const btn = f.querySelector('.btn');
      formErr(f, '');
      busy(btn, true, '저장 중');
      try {
        const rivals = f.querySelector('[name=rivals]').value.split(',').map((x) => x.trim()).filter(Boolean);
        const d = await api('/admin/settings', { method: 'POST', body: { rivals, currency: f.querySelector('[name=currency]').value } });
        S.settings = d.settings;
        toast('설정을 저장했습니다');
        refresh();
      } catch (e) { formErr(f, e.message); busy(btn, false); }
    },
  };

  /* ================================================================
     버튼 동작
     ================================================================ */
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  async function act(fn, el) {
    if (el) el.disabled = true;
    try { await fn(); } catch (e) { toast(e.message, true); } finally { if (el && document.contains(el)) el.disabled = false; }
  }
  const ACT = {
    'gate-tab': (el) => { gateMsg(''); setGateTab(el.dataset.tab); },
    'modal-close': () => closeModal(),
    retry: () => { S.route = ''; show(routeFromHash()); },
    toggle: (el) => {
      const li = el.closest('li');
      const key = el.dataset.key;
      const open = !li.classList.contains('is-open');
      li.classList.toggle('is-open', open);
      if (open) S.open.add(key); else S.open.delete(key);
      if (el.hasAttribute('aria-expanded')) el.setAttribute('aria-expanded', String(open));
    },
    'duty-start': (el) => act(async () => {
      const d = await api('/duty/start', { method: 'POST' });
      setMe(d.me);
      toast('출근했습니다');
      refresh();
    }, el),
    'duty-stop': (el) => act(async () => {
      const d = await api('/duty/stop', { method: 'POST' });
      setMe(d.me);
      toast('퇴근했습니다. 근무 ' + fDur(d.ms) + (d.peakMs ? ', 피크 ' + fDur(d.peakMs) : '') + ' 기록됨');
      refresh();
    }, el),
    'duty-peak': (el) => act(async () => {
      const d = await api('/duty/peak', { method: 'POST' });
      setMe(d.me);
      toast(d.peak ? (d.started ? '피크 타임으로 출근했습니다' : '피크 타임을 시작했습니다') : '피크 타임을 마쳤습니다. ' + fDur(d.ms) + ' 기록됨');
      refresh();
    }, el),
    'force-stop': async (el) => {
      const ok = await confirmBox({ title: '퇴근 처리', text: el.dataset.name + '님을 퇴근 처리할까요? 지금까지의 근무 시간은 기록됩니다.', ok: '퇴근 처리' });
      if (!ok) return;
      act(async () => {
        const d = await api('/duty/force-stop', { method: 'POST', body: { id: Number(el.dataset.id) } });
        toast(el.dataset.name + '님을 퇴근 처리했습니다. ' + fDur(d.ms) + ' 기록됨');
        refresh();
      });
    },
    'duty-tab': (el) => { S.dutyTab = el.dataset.tab; refresh(); },
    'rep-filter': (el) => { S.repType = el.dataset.type; refresh(); },
    'rep-new': () => openReportForm(),
    'ro-edit': () => { S.rosterEdit = !S.rosterEdit; if (S.roster) paintRoster(S.roster); },
    'ro-copy': async () => {
      if (!S.roster) return;
      const ok = await copyText(S.roster.text);
      if (!ok) { toast('복사하지 못했습니다. 브라우저 권한을 확인하세요', true); return; }
      toast(S.roster.text.length > 2000 ? '복사했습니다. 2000자가 넘어서 디스코드에는 나눠서 올려야 해요' : '디스코드에 붙여넣을 직급표를 복사했습니다');
    },
    'ro-import': () => openRosterImport(),
    'ro-tier-add': () => openTierForm(null),
    'ro-tier-edit': (el) => { const t = roTier(el.dataset.id); if (t) openTierForm(t); },
    'ro-tier-move': (el) => act(() => rosterOp({ op: 'tier.move', id: Number(el.dataset.id), dir: Number(el.dataset.d) }), el),
    'ro-tier-del': async (el) => {
      const t = roTier(el.dataset.id);
      if (!t) return;
      const yes = await confirmBox({
        title: '구분 삭제',
        text: t.name + ' 구분을 지울까요?' + (t.titles.length ? ' 안에 있는 직급 ' + t.titles.length + '개와 ' + t.count + '명도 같이 지워집니다.' : ''),
        ok: '삭제', danger: true,
      });
      if (yes) act(() => rosterOp({ op: 'tier.remove', id: t.id }, '구분 ' + t.name + '을(를) 지웠습니다'));
    },
    'ro-title-add': (el) => { const t = roTier(el.dataset.id); if (t) openTitleForm(t, null); },
    'ro-title-edit': (el) => { const f = roTitle(el.dataset.id); if (f) openTitleForm(f.tier, f.title); },
    'ro-title-move': (el) => act(() => rosterOp({ op: 'title.move', id: Number(el.dataset.id), dir: Number(el.dataset.d) }), el),
    'ro-title-del': async (el) => {
      const f = roTitle(el.dataset.id);
      if (!f) return;
      closeModal();
      const label = f.title.name || '이름 없는 직급';
      if (f.title.people.length) {
        const yes = await confirmBox({ title: '직급 삭제', text: label + ' 직급을 지울까요? ' + f.title.people.length + '명도 직급표에서 같이 빠집니다.', ok: '삭제', danger: true });
        if (!yes) return;
      }
      act(() => rosterOp({ op: 'title.remove', id: f.title.id }, '직급 ' + label + '을(를) 지웠습니다'));
    },
    'ro-person': (el) => { const f = roPerson(el.dataset.id); if (f) openPersonForm(f.title, f.person); },
    'ro-person-add': (el) => { const f = roTitle(el.dataset.id); if (f) openPersonForm(f.title, null); },
    'ro-person-del': (el) => {
      const f = roPerson(el.dataset.id);
      if (!f) return;
      closeModal();
      act(() => rosterOp({ op: 'person.remove', id: f.person.id }, pLabel(f.person) + '을(를) 직급표에서 뺐습니다'));
    },
    'shot-pick': () => { const inp = $('#shotFile'); if (inp) inp.click(); },
    'calc-step': (el) => {
      const id = el.dataset.id;
      S.calc[id] = Math.max(0, Math.min(999, (S.calc[id] || 0) + Number(el.dataset.d)));
      updateCalc();
    },
    'calc-reset': () => { S.calc = {}; updateCalc(); },
    'calc-copy': async () => {
      const ok = await copyText(quoteText());
      toast(ok ? '견적을 복사했습니다. 디스코드나 게임 채팅에 붙여넣으세요' : '복사하지 못했습니다. 견적을 직접 선택해서 복사해 주세요', !ok);
    },
    'calc-deposit': async (el) => {
      const lines = calcLines();
      const total = lines.reduce((t, l) => t + l.sum, 0);
      if (!total) return;
      const memo = ('총기 판매: ' + lines.map((l) => l.g.name + ' ' + l.q + gunUnit(l.g)).join(', ')).slice(0, 80);
      const ok = await confirmBox({ title: '판매 금액 입금 기록', text: won(total) + '을 조직 자금 입금으로 기록할까요? 메모: ' + memo, ok: '입금 기록' });
      if (!ok) return;
      act(async () => {
        await api('/ledger', { method: 'POST', body: { kind: 'in', amount: total, memo } });
        S.calc = {};
        updateCalc();
        toast(won(total) + '을 조직 자금에 입금으로 기록했습니다');
      }, el);
    },
    'log-filter': (el) => { S.logGroup = el.dataset.group; refresh(); },
    'logs-more': (el) => act(async () => {
      const last = S.logItems[S.logItems.length - 1];
      if (!last) return;
      const d = await api('/logs?limit=' + S.logLimit + '&before=' + last.id + (S.logGroup ? '&group=' + S.logGroup : ''));
      S.logItems = S.logItems.concat(d.logs);
      S.logMore = d.more;
      S.logTotal = d.total;
      const book = $('#logbook');
      if (book) book.innerHTML = logBookHtml();
    }, el),
    'logs-save': (el) => act(async () => {
      const d = await api('/logs/export');
      const lines = d.logs.slice().reverse().map((a) => {
        const k = kp(a.ts);
        return k.y + '-' + p2(k.mo) + '-' + p2(k.d) + ' ' + p2(k.h) + ':' + p2(k.mi) + ':' + p2(k.s) + '  [' + (LOG_LABEL[a.type] || '기타') + ']  ' + a.text;
      });
      const k = kp(now());
      const head = '적야 인트라넷 로그 ' + d.logs.length + '건 (저장 ' + k.y + '-' + p2(k.mo) + '-' + p2(k.d) + ' ' + p2(k.h) + ':' + p2(k.mi) + ')';
      download(new Blob(['﻿' + head + '\n\n' + lines.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' }),
        'jeokya-log-' + k.y + p2(k.mo) + p2(k.d) + '-' + p2(k.h) + p2(k.mi) + '.txt');
      toast('로그 ' + d.logs.length + '건을 파일로 저장했습니다');
    }, el),
    'sound-toggle': () => {
      const on = !soundOn();
      store.set(SOUND_KEY, on ? 'on' : 'off');
      renderSoundBtn();
      toast(on ? '알림 소리를 켰습니다' : '알림 소리를 껐습니다. 새 소식 알림은 계속 보입니다');
      if (on) chime('duty_on');
    },
    'notif-open': (el) => { el.remove(); if (S.route !== 'logs') location.hash = '#logs'; },
    'rep-del': async (el) => {
      const ok = await confirmBox({ title: '보고서 지우기', text: '이 보고서를 지울까요? 전적과 땅 집계에서도 빠집니다.', ok: '지우기', danger: true });
      if (!ok) return;
      act(async () => { await api('/reports/' + el.dataset.id, { method: 'DELETE' }); toast('보고서를 지웠습니다'); refresh(); });
    },
    'ledger-del': async (el) => {
      const ok = await confirmBox({ title: '장부 기록 지우기', text: '이 기록을 지우면 잔액도 다시 계산됩니다. 지울까요?', ok: '지우기', danger: true });
      if (!ok) return;
      act(async () => { await api('/ledger/' + el.dataset.id, { method: 'DELETE' }); toast('장부 기록을 지웠습니다'); refresh(); });
    },
    approve: (el) => act(async () => {
      await api('/admin/approve', { method: 'POST', body: { id: Number(el.dataset.id) } });
      toast(el.dataset.name + '님의 가입을 승인했습니다');
      refresh();
    }, el),
    reject: async (el) => {
      const ok = await confirmBox({ title: '가입 거절', text: el.dataset.name + '님의 가입 신청을 거절할까요?', ok: '거절하기', danger: true });
      if (!ok) return;
      act(async () => { await api('/admin/reject', { method: 'POST', body: { id: Number(el.dataset.id) } }); toast('가입 신청을 거절했습니다'); refresh(); });
    },
    'reset-pw': async (el) => {
      const ok = await confirmBox({ title: '비밀번호 초기화', text: el.dataset.name + '님의 비밀번호를 임시 비밀번호로 바꿀까요? 지금 접속은 끊깁니다.', ok: '초기화' });
      if (!ok) return;
      act(async () => {
        const d = await api('/admin/reset-password', { method: 'POST', body: { id: Number(el.dataset.id) } });
        modal({
          title: '임시 비밀번호',
          body: '<p class="confirm-text" style="margin:0">' + esc(el.dataset.name) + '님에게 아래 비밀번호를 전해 주세요. 로그인한 뒤 바로 바꾸도록 안내하세요.</p>' +
            '<code class="temp-pw">' + esc(d.temp) + '</code><div class="form-actions"><button type="button" class="btn" data-act="modal-close">확인</button></div>',
        });
      });
    },
    kick: (el) => openKickForm(el.dataset.id, el.dataset.name),
    warn: (el) => openWarnForm(el.dataset.id, el.dataset.name),
    'warn-list': (el) => openWarnList(el.dataset.id, el.dataset.name, el.dataset.editable === '1'),
    'my-warns': () => openWarnList(null, S.me.name, false),
    'warn-cancel': async (el) => {
      const ok = await confirmBox({ title: '경고 취소', text: '이 경고를 취소할까요? 누적 횟수에서 빠집니다.', ok: '경고 취소' });
      if (!ok) return;
      act(async () => {
        const d = await api('/warnings/' + el.dataset.id, { method: 'DELETE' });
        toast('경고를 취소했습니다. 누적 ' + d.count + '회');
        refresh();
      });
    },
    export: (el) => act(async () => {
      const d = await api('/admin/export');
      const k = kp(now());
      download(new Blob([JSON.stringify(d.backup, null, 2)], { type: 'application/json' }),
        'jeokya-backup-' + k.y + p2(k.mo) + p2(k.d) + '-' + p2(k.h) + p2(k.mi) + '.json');
      toast('백업 파일을 내려받았습니다');
    }, el),
    import: () => { const inp = $('#importFile'); if (inp) inp.click(); },
    password: () => openPasswordForm(),
    logout: async () => {
      try { await api('/auth/logout', { method: 'POST' }); } catch (_) { /* 이미 만료 */ }
      store.del(TOKEN_KEY);
      S.token = null;
      S.route = '';
      showGate();
    },
    'me-menu': () => openMeMenu(),
    'demo-reset': async (el) => {
      if (!window.JEOKYA_DEMO_RESET) return;
      el.disabled = true;
      await window.JEOKYA_DEMO_RESET();
      store.del(TOKEN_KEY);
      S.token = null;
      S.route = '';
      el.disabled = false;
      showGate('예시 데이터를 처음 상태로 되돌렸습니다.');
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const fn = FORMS[f.dataset.form];
    if (!fn || f.dataset.busy) return;
    f.dataset.busy = '1';
    Promise.resolve(fn(f)).finally(() => { delete f.dataset.busy; });
  });
  document.addEventListener('change', async (e) => {
    if ((e.target.name === 'kind' || e.target.name === 'rival') && e.target.closest('form[data-form="report"]')) { syncReportForm(e.target.closest('form')); return; }
    if (e.target.id === 'shotFile') { const files = Array.from(e.target.files || []); e.target.value = ''; handleShots(files); return; }
    const sel = e.target.closest && e.target.closest('[data-change="rank"]');
    if (sel) {
      const level = Number(sel.value);
      sel.disabled = true;
      try {
        await api('/admin/rank', { method: 'POST', body: { id: Number(sel.dataset.id), level } });
        toast(sel.dataset.name + '님을 ' + josa(rankName(level), '으로/로') + ' 임명했습니다');
      } catch (err) { toast(err.message, true); }
      refresh();
      return;
    }
    if (e.target.id === 'importFile') {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      let backup;
      try { backup = JSON.parse(await file.text()); } catch (_) { toast('JSON 백업 파일이 아닙니다', true); return; }
      const ok = await confirmBox({ title: '백업 복원', text: '지금 데이터가 모두 백업 파일 내용으로 바뀝니다. 복원한 뒤에는 다시 로그인해야 합니다.', ok: '복원하기', danger: true });
      if (!ok) return;
      try {
        await api('/admin/import', { method: 'POST', body: { backup } });
        store.del(TOKEN_KEY);
        S.token = null;
        S.route = '';
        showGate('복원했습니다. 다시 로그인해 주세요.');
      } catch (err) { toast(err.message, true); }
    }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.calc) {
      el.value = el.value.replace(/[^\d]/g, '').slice(0, 3);
      S.calc[el.dataset.calc] = Math.min(999, digits(el.value));
      updateCalc();
      return;
    }
    if (el.classList && el.classList.contains('gid-input')) {
      el.value = el.value.replace(/[^\d]/g, '').slice(0, 10);
      return;
    }
    if (el.classList && el.classList.contains('ro-import-text')) {
      const f = el.form, btn = f && f.querySelector('.btn');
      if (btn && btn.dataset.step === 'apply') {
        btn.dataset.step = 'check';
        btn.textContent = '확인';
        btn.classList.remove('danger');
        const out = f.querySelector('.ro-preview');
        if (out) out.hidden = true;
      }
      return;
    }
    if (el.classList && el.classList.contains('land-input')) {
      el.value = el.value.replace(/[^\d]/g, '').slice(0, 4);
      return;
    }
    if (!el.classList || !el.classList.contains('num-input')) return;
    const d = el.value.replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
    el.value = d.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) closeModal(); });
  // 스크린샷 붙여넣기 / 끌어다 놓기 (보고서 양식이 열려 있을 때)
  document.addEventListener('paste', (e) => {
    if (!$('form[data-form="report"]')) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => /^image\//.test(f.type));
    if (!files.length) return;
    e.preventDefault();
    handleShots(files);
  });
  document.addEventListener('dragover', (e) => {
    if (!e.target.closest || !e.target.closest('form[data-form="report"]')) return;
    e.preventDefault();
    const z = $('.shot');
    if (z) z.classList.add('drag');
  });
  document.addEventListener('dragleave', (e) => {
    if (e.target.classList && e.target.classList.contains('shot')) e.target.classList.remove('drag');
  });
  document.addEventListener('drop', (e) => {
    if (!e.target.closest || !e.target.closest('form[data-form="report"]')) return;
    e.preventDefault();
    const z = $('.shot');
    if (z) z.classList.remove('drag');
    handleShots(e.dataTransfer && e.dataTransfer.files);
  });
  // 브라우저는 사용자가 한 번 누른 뒤에야 소리를 낼 수 있다
  const unlockAudio = () => { if (soundOn()) audio(); };
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });
  window.addEventListener('hashchange', () => { if (S.me && !$('#app').hidden) show(routeFromHash()); });
  window.addEventListener('scroll', () => { $('#top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refresh(); });

  setInterval(tick, 1000);
  setInterval(pollLive, 5000);
  setInterval(() => {
    if (!S.me || document.hidden || S.modal || !VIEWS[S.route] || !VIEWS[S.route].poll) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    refresh();
  }, 20000);

  /* ================================================================
     시작
     ================================================================ */
  async function init() {
    if (reduced) $$('#defs animate').forEach((a) => a.remove());
    if (DEMO) { $('#demoNote').hidden = false; $('#joinForm .gate-note').hidden = true; }
    try { S.calc = JSON.parse(store.get(CALC_KEY) || '{}') || {}; } catch (_) { S.calc = {}; }
    S.token = store.get(TOKEN_KEY);
    if (S.token) {
      try {
        const d = await api('/me');
        S.me = d.me;
        S.settings = d.settings;
        $('#gate').hidden = true;
        openApp();
        return;
      } catch (_) {
        store.del(TOKEN_KEY);
        S.token = null;
      }
    }
    showGate();
  }
  init();
})();
</script>
</body>
</html>
